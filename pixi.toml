[workspace]
authors = ["Alex-Lewandowski <aflewandowski@alaska.edu>"]
channels = ["conda-forge"]
name = "NISAR_ATBD_Cookbook"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
jupyterlab = "*"
ipyfilechooser = "*"
mystmd = "*"
pip = "*"
asf_search = "*"
earthaccess = "*"
ipympl = "*"
matplotlib-base = "*"
numpy = "*"
gdal = "*"
rasterio = "*"
rioxarray = "*"
s3fs = "*"
jupyterlab-myst = "*"
ipykernel = "*"
ipyleaflet = "*"
ipywidgets = "*"
shapely = "*"
h5netcdf = "*"
dask = "*"
h5py = "*"
hyp3_sdk = "*"
mintpy = "*"
scipy = "*"
wget = "*"
awscli = "*"
geopandas = "*"
pandas = "*"
sardem = "*"
scikit-learn = "*"
pyproj = "*"
fpdf = "*"
tqdm = "*"
plotly = "*"
seaborn = "*"
beautifulsoup4 = "*"
cartopy = "*"
fiona = "*"
leafmap = "*"
networkx = "*"
pillow = "*"
prettytable = "*"
proj = "*"
psycopg2 = "*"
requests = "*"
rtree = "*"
scikit-image = "*"
sqlalchemy = "*"
aria2 = "*"
datashader = "*"
geoviews = "*"
holoviews = "*"
hvplot = "*"


[pypi-dependencies]
jb-toc = ">=2.0.1, <3"

[tasks]
register-kernel = "python -m ipykernel install --user --name NISAR_ATBD_Cookbook --display-name 'NISAR_ATBD_Cookbook'"
lab = { cmd = "jupyter lab", depends-on = ["register-kernel"] }
